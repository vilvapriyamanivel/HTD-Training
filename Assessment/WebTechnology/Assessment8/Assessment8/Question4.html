<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Hide Odd Rows</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>

    <table border="1">
        <tr><td>Row 1</td></tr>
        <tr><td>Row 2</td></tr>
        <tr><td>Row 3</td></tr>
        <tr><td>Row 4</td></tr>
    </table>

    <script>
        $(document).ready(function () {
            $("tr:odd").hide();
        });
    </script>

</body>
</html>
