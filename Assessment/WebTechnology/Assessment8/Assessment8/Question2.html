<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>  Question2 JS loop  for odd or even </title>
</head>
<body>


    <h2>Check Console Output</h2>

    <script>
for (let i = 0; i <= 15; i++) {
    if (i % 2 === 0) {
        console.log(i + " is even");
    } else {
        console.log(i + " is odd");
    }
}
    </script>

</body>
</html>
