<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>H1 Styling</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>

    <div>
        <h1>Inside Div</h1>
    </div>

    <h1>Outside Div</h1>
    <div>
        <h1>Inside Another Div</h1>
    </div>
    <script>
        $(document).ready(function () {
            $("div > h1").css("background-color", "yellow");
        });
    </script>

</body>
</html>
