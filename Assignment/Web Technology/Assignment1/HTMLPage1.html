<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Assignment</title>
</head>
<body>

    <!-- 1. Largest heading -->
    <h1>Welcome</h1>

    <!-- 2. Second highest heading -->
    <h2>About Us</h2>

    <!-- 3. Third highest heading, centered -->
    <h3 align="center">Welcome To HTML</h3>

    <!-- 4. Heading with specific text color -->
    <h3 style="color:#0066cc;">Services</h3>

    <!-- 5. Underlined heading with red color -->
    <h3 style="color:#ff0000;">
        <u>Important</u>
    </h3>

    <!-- 6. Text input field for user's name -->
    <input type="text" placeholder="Enter your name">

    <br><br>

    <!-- 7. Password input field with placeholder -->
    <input type="password" placeholder="Enter your password">

    <br><br>

    <!-- 8. Checkbox with label -->
    <input type="checkbox" id="agree">
    <label for="agree">I Agree</label>

    <br><br>

    <!-- 9. Audio file with controls -->
    <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <br><br>

    <!-- 10. Unordered list with two items -->
    <ul type="square">
        <li>Red</li>
        <li>Blue</li>
    </ul>

</body>
</html>
